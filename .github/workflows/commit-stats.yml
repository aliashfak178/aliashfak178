name: Update Commit Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/commit-stats.svg"
      - "assets/commit-stats.png"
      - "README.md"

permissions:
  contents: write

jobs:
  update-commit-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install Pillow

      - name: Generate commit stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_commit_stats.py aliashfak178 assets/commit-stats.svg assets/commit-stats.png

      - name: Commit and push updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/commit-stats.svg assets/commit-stats.png
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update commit activity stats [skip ci]"
            git push
          fi
